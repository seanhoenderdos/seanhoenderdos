<svg width="900" height="520" viewBox="0 0 900 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sean Hoenderdos profile card</title>
  <desc id="desc">A refined dark profile card for Sean Hoenderdos, AI and full-stack developer.</desc>
  <defs>
    <radialGradient id="spotlight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(450 0) rotate(90) scale(360 540)">
      <stop stop-color="#38BDF8" stop-opacity="0.24"/>
      <stop offset="0.46" stop-color="#22C55E" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="border" x1="96" y1="72" x2="804" y2="448" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.52" stop-color="#A3E635"/>
