    <path d="M25 57C34 39 47 30 63 30C74 30 83 34 90 42" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
    <path d="M14 70C26 56 39 50 54 50C71 50 82 57 90 70" stroke="#A3E635" stroke-width="6" stroke-linecap="round"/>
