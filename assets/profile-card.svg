  <text x="260" y="214" fill="url(#text)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="0">AI + Full-Stack</text>
  <text x="260" y="268" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="0">Developer</text>
  <text x="260" y="318" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="500" letter-spacing="0">Next.js · TypeScript · React Native · AI Systems</text>

