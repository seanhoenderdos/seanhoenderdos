    <rect x="96.75" y="72.75" width="706.5" height="374.5" rx="27.25" stroke="url(#border)" stroke-opacity="0.72" stroke-width="1.5"/>
    <rect x="111" y="87" width="678" height="346" rx="22" fill="#0F172A" fill-opacity="0.72" stroke="#1E293B"/>
  </g>

  <path d="M128 160C208 109 298 97 398 125C511 157 584 171 693 120C725 105 756 96 789 93" stroke="#38BDF8" stroke-opacity="0.18" stroke-width="2"/>
  <path d="M112 376C234 319 342 311 436 350C549 397 661 405 789 335" stroke="#A3E635" stroke-opacity="0.18" stroke-width="2"/>

  <g transform="translate(139 116)">
