<svg
  width="900"
  height="420"
  viewBox="0 0 900 420"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Sean Hoenderdos — Frontend Developer and UX Designer</title>
  <desc id="desc">
    Minimal portfolio-inspired GitHub banner for Sean Hoenderdos with a warm off-white background,
    centered lavender logo mark, bold name, and supporting role text.
  </desc>

  <!-- Background -->
  <rect width="900" height="420" fill="#F5F3EF"/>

  <!-- Large centered logo mark -->
  <g transform="translate(450 138) scale(2.4)">
    
  </g>

  <!-- Name -->
  <text
    x="450"
    y="245"
    text-anchor="middle"
    fill="#111111"
    font-family="Inter, Arial, sans-serif"
    font-size="66"
    font-weight="800"
    letter-spacing="-3.2"
  >
    SEAN HOENDERDOS
  </text>

  <!-- Role -->
  <text
    x="450"
    y="285"
    text-anchor="middle"
    fill="#7E7975"
    font-family="Inter, Arial, sans-serif"
    font-size="14"
    font-weight="500"
    letter-spacing="2.4"
  >
    FRONTEND DEVELOPER + UX DESIGNER
  </text>

  <!-- Optional subtle bottom line -->
  <line
    x1="210"
    y1="325"
    x2="690"
    y2="325"
    stroke="#111111"
    stroke-opacity="0.10"
  />
</svg>
